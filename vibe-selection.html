        <p class="eyebrow"><span></span> Find your natural rhythm</p>
        <h1>Apna <em>Vibe</em> Chuniye</h1>

      <div class="vibe-rule"><span>SELECT ONE / YOU CAN SHIFT LATER</span><i></i><span>02—04</span></div>

      <section class="vibe-grid" aria-label="Choose a creative vibe">
        <button class="vibe-card vibe-alpha stagger-in" type="button" data-vibe="alpha" aria-label="Choose Alpha vibe">
          <span class="vibe-card-number">01</span>
          <span class="vibe-card-kicker">THE FORWARD THINKER</span>

            <svg viewBox="0 0 260 190"><path d="M130 19 226 73v58l-96 40-96-40V73z"/><path d="m34 73 96 48 96-48M130 121v50"/><path d="M87 77h87v52H87zM101 91h58M101 103h34M101 115h47"/><circle cx="191" cy="51" r="6"/><path d="M202 35v-16M194 27h16M51 143l-15 14M51 143l-1 17"/></svg>
          </span>
          <span class="vibe-card-body"><strong>Alpha</strong><span>Sharp ideas. Clean systems. A little ahead of the room.</span><small>futuristic / precise / curious</small></span>
          <span class="vibe-card-action">choose this rhythm <b>↗</b></span>
        </button>

        <button class="vibe-card vibe-millennial stagger-in" type="button" data-vibe="millennial" aria-label="Choose Millennial vibe">
          <span class="vibe-card-number">02</span>
          <span class="vibe-card-kicker">THE STORY KEEPER</span>

            <svg viewBox="0 0 260 190"><circle cx="130" cy="91" r="67"/><path d="M62 129V72c0-9 7-16 16-16h104c9 0 16 7 16 16v57M52 129h156M72 56l7-15h102l7 15M83 131v17M177 131v17"/><circle cx="130" cy="97" r="21"/><circle cx="130" cy="97" r="7"/><path d="M41 31c12-8 25-12 39-12M219 32c-11-8-22-12-35-13M42 159h42M176 159h42"/></svg>
          </span>
          <span class="vibe-card-body"><strong>Millennial</strong><span>Warm edits of culture, craft, memory and contemporary life.</span><small>rooted / thoughtful / human</small></span>
          <span class="vibe-card-action">choose this rhythm <b>↗</b></span>
        </button>

        <button class="vibe-card vibe-genz stagger-in" type="button" data-vibe="genz" aria-label="Choose Gen-Z vibe">
          <span class="vibe-card-number">03</span>
          <span class="vibe-card-kicker">THE SIGNAL MAKER</span>

        </button>
